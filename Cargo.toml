[package]
name = "certonaut"
version = "0.2.0"
repository = "https://github.com/certonaut/certonaut"
license = "MIT"
edition = "2024"
rust-version = "1.92.0"
default-run = "certonaut"

[features]
magic-solver = ["dep:libbpf-rs", "dep:libbpf-cargo", "dep:vmlinux", "dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
aws-lc-rs = { version = "1", default-features = false, features = ["alloc", "ring-io", "aws-lc-sys", "prebuilt-nasm"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
futures = "0.3"
httpdate = "1"
inquire = { version = "0.9", features = ["editor"] }
nom-rfc8288 = "0.4"
parking_lot = "0.12"
pem = "4"
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml_edit = { version = "0.25", features = ["serde", "display"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
x509-parser = "0.17"
itertools = "0.14"
cyborgtime = "2"
strum = { version = "0.28.0", features = ["derive"] }
fs4 = { version = "1", features = ["tokio"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "time"] }
rand = "0.10"
hickory-resolver = "0.26"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
caps = { version = "0.5" }
libbpf-rs = { version = "0.26", features = ["static", "vendored"], optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "server"], optional = true }
hyper-util = { version = "0.1", optional = true }

[build-dependencies]
toml = "1"

[target.'cfg(target_os = "linux")'.build-dependencies]
libbpf-cargo = { version = "0.26", optional = true }
vmlinux = { version = "0.0", git = "https://github.com/libbpf/vmlinux.h.git", rev = "83a228cf37fc65f2d14e4896a04922b5ee531a94", optional = true }

[dev-dependencies]
bstr = "1"
faux = "0.1"
hickory-server = { version = "0.26", features = ["resolver"] }
mockito = "1"
rstest = "0.26"
tempfile = "3"
test-log = { version = "0.2", default-features = false, features = ["color", "trace"] }
testcontainers = "0.28"

[profile.release]
# Makes linking really sloooow, but gives us a faster + smaller binary.
lto = "fat"

[[bin]]
name = "create-dev-db"
path = "src/bin/create_dev_db.rs"
